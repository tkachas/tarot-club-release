services:
  app:
    build: .
    restart: unless-stopped
    read_only: true
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
